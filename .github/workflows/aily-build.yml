name: 每日生成日报

# 日报生成已改为本地定时任务（Windows 任务计划 AI-Daily-Report）。
# GitHub Actions 服务器无法访问模型网关（DNS 不解析），故仅保留手动触发用于提交日报。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install feedparser python-dotenv openai

      - name: 检查 Secrets 是否配置
        run: |
          python - <<'EOF'
          import os
          for k in ["LLM_BASE_URL", "LLM_API_KEY", "LLM_MODEL"]:
              v = os.getenv(k, "")
              if not v.strip():
                  print(f"{k}: 未配置!")
              else:
                  print(f"{k}: 已配置, 长度{len(v)}, 前后有空格: {v != v.strip()}")
          EOF

      - name: 生成日报
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python main.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "daily: 生成当日AI双语日报" || echo "无更新"
          git push
